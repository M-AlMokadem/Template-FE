<section class="users-page">
  <mat-card class="users-card" appearance="outlined">
    <div class="users-header">
      <div>
        <p class="eyebrow">Administration</p>
        <h1>Users Directory</h1>
      </div>

      <app-search-field
        label="Search users"
        placeholder="Name or email"
        [value]="searchTerm()"
        (valueChange)="searchTerm.set($event)"
        (submitted)="search()"
      ></app-search-field>
    </div>

    <app-user-form
      [value]="newUser()"
      [isSubmitting]="isCreating()"
      (saved)="createUser($event)"
    ></app-user-form>

    @if (isLoading()) {
      <app-page-state kind="loading" title="Loading users..." message="Fetching the latest directory entries."></app-page-state>
    } @else if (loadError()) {
      <app-page-state
        kind="error"
        title="Users could not be loaded"
        message="Check the API connection and try again."
        (retry)="search()"
      ></app-page-state>
    } @else if (users().length > 0) {
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Status</th>
              <th class="actions">Action</th>
            </tr>
          </thead>
          <tbody>
            @for (user of users(); track user.id) {
              <tr>
                <td>{{ user.fullName }}</td>
                <td>{{ user.email }}</td>
                <td>
                  <span class="status-pill" [class.is-active]="user.isActive">
                    {{ user.isActive ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="actions">
                  <button mat-button type="button" (click)="toggleStatus(user)">
                    {{ user.isActive ? 'Deactivate' : 'Activate' }}
                  </button>
                  <button mat-button color="warn" type="button" (click)="removeUser(user)">Delete</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <app-pagination-controls
        [pageNumber]="pageNumber()"
        [pageSize]="pageSize()"
        [totalCount]="totalCount()"
        [totalPages]="totalPages()"
        (previous)="previousPage()"
        (next)="nextPage()"
      ></app-pagination-controls>
    } @else {
      <app-page-state kind="empty" title="No users found" message="Try a different search term or clear your filter."></app-page-state>
    }
  </mat-card>
</section>
