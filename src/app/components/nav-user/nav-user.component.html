@if (currentUser(); as user) {
	<div class="nav-user-card">
		<div class="avatar">{{ initials() }}</div>
		<div class="user-copy">
			<span class="user-name">{{ user.fullName }}</span>
			<span class="user-email">{{ user.email }}</span>
			@if (user.roles.length > 0) {
				<span class="user-email">{{ user.roles.join(' • ') }}</span>
			}
		</div>
		<button mat-button type="button" class="logout-button" (click)="logout()">Logout</button>
	</div>
} @else {
	<div class="guest-actions">
		<a mat-button class="register-button" routerLink="/register">Register</a>
		<a mat-flat-button class="login-button" routerLink="/login">Sign in</a>
	</div>
}
