<div class="app-shell">
  <mat-toolbar class="topbar" color="primary">
    <a class="brand" routerLink="/">{{ title }}</a>
    <span class="topbar-spacer"></span>
    <nav class="topbar-nav" aria-label="Primary">
      <a mat-button routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a mat-button href="#features">Features</a>
      <a mat-button href="#metrics">Metrics</a>
      <a mat-button routerLink="/login" routerLinkActive="is-active">Login</a>
      <app-nav-user></app-nav-user>
    </nav>
  </mat-toolbar>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <div>
      <p class="footer-title">VersionZero</p>
      <p class="footer-copy">A product-first Angular starter with a bright systems aesthetic, modern motion-ready surfaces, and room for real business flows.</p>
    </div>
    <div class="footer-links">
      <a href="#features">Features</a>
      <a href="#metrics">Metrics</a>
      <a href="#start">Get Started</a>
    </div>
  </footer>
</div>
